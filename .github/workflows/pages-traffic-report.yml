name: Daily GitHub Pages Traffic Report (org-wide)

on:
  schedule:
    # 00:15 UTC daily (~09:15 JST)
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      ORG: OctWebJP
      # A PAT (classic: `repo` scope) or fine-grained token with
      # "Administration: Read" + "Pages: Read" + "Metadata: Read" on every
      # repo in the org that has Pages enabled. The default GITHUB_TOKEN is
      # scoped to this repo only, so a cross-repo token is required for the
      # Traffic API on the other repos.
      GH_TOKEN: ${{ secrets.ORG_TRAFFIC_TOKEN }}
      ISSUE_REPO: ${{ github.repository }}
    steps:
      - name: Verify token
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Missing secret ORG_TRAFFIC_TOKEN. Create a PAT with push access to every Pages repo in $ORG and store it as a repository secret named ORG_TRAFFIC_TOKEN."
            exit 1
          fi

      - name: Collect Pages signals across the org
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          today="$(date -u +%Y-%m-%d)"
          yday="$(date -u -d 'yesterday' +%Y-%m-%d 2>/dev/null || date -u -v-1d +%Y-%m-%d)"
          echo "date=$today" >> "$GITHUB_OUTPUT"

          # Every repo in the org with Pages enabled.
          gh api --paginate "orgs/${ORG}/repos?per_page=100" \
            --jq '[.[] | select(.has_pages == true) | {name, private, html_url, updated_at}]' \
            > repos.json
          repo_count="$(jq 'length' repos.json)"
          echo "Found ${repo_count} Pages repos."

          total_views=0
          total_uniques=0
          rows=""
          details=""

          for name in $(jq -r '.[].name' repos.json); do
            echo "::group::$name"

            pages_json="$(gh api "repos/${ORG}/${name}/pages" 2>/dev/null || echo '{}')"
            pages_url="$(echo "$pages_json" | jq -r '.html_url // ""')"
            pages_status="$(echo "$pages_json" | jq -r '.status // "unknown"')"
            https_enforced="$(echo "$pages_json" | jq -r '.https_enforced // "n/a"')"

            latest_build_json="$(gh api "repos/${ORG}/${name}/pages/builds/latest" 2>/dev/null || echo '{}')"
            build_status="$(echo "$latest_build_json" | jq -r '.status // "n/a"')"
            build_updated="$(echo "$latest_build_json" | jq -r '.updated_at // "n/a"')"
            build_error="$(echo "$latest_build_json" | jq -r '.error.message // ""')"

            traffic_json="$(gh api "repos/${ORG}/${name}/traffic/views" 2>/dev/null || echo '{"count":0,"uniques":0,"views":[]}')"
            views_14d="$(echo "$traffic_json" | jq -r '.count')"
            uniques_14d="$(echo "$traffic_json" | jq -r '.uniques')"

            views_yday="$(echo "$traffic_json" | jq -r --arg d "$yday" '[.views[] | select(.timestamp | startswith($d)) | .count] | add // 0')"
            uniques_yday="$(echo "$traffic_json" | jq -r --arg d "$yday" '[.views[] | select(.timestamp | startswith($d)) | .uniques] | add // 0')"

            top_paths="$(gh api "repos/${ORG}/${name}/traffic/popular/paths" 2>/dev/null || echo '[]')"
            top_refs="$(gh api "repos/${ORG}/${name}/traffic/popular/referrers" 2>/dev/null || echo '[]')"

            total_views=$(( total_views + views_14d ))
            total_uniques=$(( total_uniques + uniques_14d ))

            case "$build_status" in
              built)   build_flag="✅" ;;
              n/a)     build_flag="❔" ;;
              *)       build_flag="⚠️" ;;
            esac

            rows+="| [\`${name}\`](${pages_url}) | ${build_flag} ${build_status} | ${views_yday} | ${uniques_yday} | ${views_14d} | ${uniques_14d} |"$'\n'

            per_day="$(echo "$traffic_json" | jq -r '.views | map("- \(.timestamp[0:10]): \(.count) views / \(.uniques) uniques") | .[]')"
            paths_table="$(echo "$top_paths" | jq -r 'if length==0 then "_No path data yet._" else (["| Path | Views | Uniques |","| --- | ---: | ---: |"] + (map("| `\(.path)` | \(.count) | \(.uniques) |"))) | join("\n") end')"
            refs_table="$(echo "$top_refs"  | jq -r 'if length==0 then "_No referrer data yet._" else (["| Referrer | Views | Uniques |","| --- | ---: | ---: |"] + (map("| **\(.referrer)** | \(.count) | \(.uniques) |"))) | join("\n") end')"

            details+=$'<details><summary><code>'"${name}"$'</code> — full breakdown</summary>\n\n'
            details+="- Pages URL: ${pages_url}"$'\n'
            details+="- Pages status: ${pages_status} (HTTPS enforced: ${https_enforced})"$'\n'
            details+="- Latest build: ${build_status} at ${build_updated}"
            [ -n "$build_error" ] && details+=" — error: ${build_error}"
            details+=$'\n\n**Per-day views (14d)**\n\n'"${per_day}"$'\n\n**Top paths (14d)**\n\n'"${paths_table}"$'\n\n**Top referrers (14d)**\n\n'"${refs_table}"$'\n\n</details>\n\n'

            echo "::endgroup::"
          done

          {
            echo "# GitHub Pages Traffic Report — ${today}"
            echo
            echo "> ⚠️ GitHub Pages does **not** expose per-request access logs via any public API. This report is built from the closest available signals: the Repository **Traffic Views / Popular Paths / Popular Referrers** endpoints (rolling 14-day window, per-day granularity) plus the **Pages Builds** endpoint. For true request-level analytics, instrument each site with a client-side provider (Plausible, GoatCounter, Cloudflare Web Analytics, GA4, …)."
            echo
            echo "## Org totals (last 14 days)"
            echo
            echo "- Org: [\`${ORG}\`](https://github.com/${ORG})"
            echo "- Repos with Pages enabled: **${repo_count}**"
            echo "- Total views: **${total_views}**"
            echo "- Total unique visitors: **${total_uniques}**"
            echo
            echo "## Per-site summary"
            echo
            echo "| Repo | Build | Views (${yday}) | Uniques (${yday}) | Views (14d) | Uniques (14d) |"
            echo "| --- | --- | ---: | ---: | ---: | ---: |"
            printf '%s' "$rows"
            echo
            echo "## Per-site detail"
            echo
            printf '%s' "$details"
            echo
            echo "---"
            echo "_Generated by \`.github/workflows/pages-traffic-report.yml\` — run [\`${GITHUB_RUN_ID}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})._"
          } > report.md

          echo "Report bytes: $(wc -c < report.md)"

      - name: Ensure labels exist
        continue-on-error: true
        run: |
          gh label create "pages-traffic" --repo "$ISSUE_REPO" --color "0E8A16" --description "Automated GitHub Pages traffic reports" 2>/dev/null || true
          gh label create "automated-report" --repo "$ISSUE_REPO" --color "C5DEF5" --description "Automated report issues" 2>/dev/null || true

      - name: Create (or update) the daily issue
        env:
          REPORT_DATE: ${{ steps.collect.outputs.date }}
        run: |
          set -euo pipefail
          title="Pages traffic report — ${REPORT_DATE}"
          # Idempotency: if today's report already exists (manual re-run), append a comment.
          existing="$(gh issue list --repo "$ISSUE_REPO" --state all --search "in:title \"${title}\"" --json number --jq '.[0].number' 2>/dev/null || echo "")"
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            echo "Issue #${existing} already exists for today; appending a comment."
            gh issue comment "$existing" --repo "$ISSUE_REPO" --body-file report.md
          else
            gh issue create --repo "$ISSUE_REPO" \
              --title "$title" \
              --body-file report.md \
              --label "pages-traffic,automated-report"
          fi
