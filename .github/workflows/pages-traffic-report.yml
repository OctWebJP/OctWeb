name: Pages Traffic Report

on:
  schedule:
    - cron: '10 0 * * *'   # daily 00:10 UTC (09:10 JST)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Build report and open issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TODAY=$(date -u +%Y-%m-%d)
          YDAY=$(date -u -d "yesterday" +%Y-%m-%dT00:00:00Z)

          VIEWS=$(gh api "repos/$REPO/traffic/views")
          PATHS=$(gh api "repos/$REPO/traffic/popular/paths")
          REFS=$(gh api "repos/$REPO/traffic/popular/referrers")
          CLONES=$(gh api "repos/$REPO/traffic/clones" || echo '{"count":0,"uniques":0}')

          TC=$(jq -r '.count'   <<<"$VIEWS")
          TU=$(jq -r '.uniques' <<<"$VIEWS")
          YC=$(jq -r --arg d "$YDAY" '[.views[]|select(.timestamp==$d)][0].count   // 0' <<<"$VIEWS")
          YU=$(jq -r --arg d "$YDAY" '[.views[]|select(.timestamp==$d)][0].uniques // 0' <<<"$VIEWS")
          CC=$(jq -r '.count'   <<<"$CLONES")
          CU=$(jq -r '.uniques' <<<"$CLONES")

          {
            echo "# 📊 GitHub Pages Traffic Report — $TODAY"
            echo
            echo "**Repository:** \`$REPO\`  "
            echo "**Pages site:** https://octwebjp.github.io/${REPO#*/}/"
            echo
            echo "## Yesterday ($YDAY)"
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Views | $YC |"
            echo "| Unique visitors | $YU |"
            echo
            echo "## Rolling 14-day totals"
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Views | $TC |"
            echo "| Unique visitors | $TU |"
            echo "| Clones | $CC (unique: $CU) |"
            echo
            echo "## Top paths (14d)"
            if [ "$(jq 'length' <<<"$PATHS")" = "0" ]; then
              echo "_No path data yet._"
            else
              echo "| Path | Views | Uniques |"
              echo "|---|---:|---:|"
              jq -r '.[] | "| `\(.path)` | \(.count) | \(.uniques) |"' <<<"$PATHS"
            fi
            echo
            echo "## Top referrers (14d)"
            if [ "$(jq 'length' <<<"$REFS")" = "0" ]; then
              echo "_No referrer data yet._"
            else
              echo "| Referrer | Views | Uniques |"
              echo "|---|---:|---:|"
              jq -r '.[] | "| **\(.referrer)** | \(.count) | \(.uniques) |"' <<<"$REFS"
            fi
            echo
            echo "## Analysis"
            if [ "$YC" -gt 0 ]; then
              echo "- Yesterday recorded **$YC views** from **$YU unique visitors**."
            else
              echo "- No traffic recorded for yesterday."
            fi
            AVG=$(( TC / 14 ))
            echo "- 14-day daily average: **~$AVG views/day**."
            if [ "$YC" -gt "$AVG" ] && [ "$AVG" -gt 0 ]; then
              echo "- 📈 Yesterday was **above** the 14-day average."
            elif [ "$YC" -lt "$AVG" ]; then
              echo "- 📉 Yesterday was **below** the 14-day average."
            fi
            echo
            echo "---"
            echo "> ℹ️ GitHub Pages does not expose raw HTTP access logs. This report is derived from the Repository Traffic API, which returns rolling 14-day view/referrer/path data. For per-request logs, add a client-side analytics tag (e.g. GoUATAG, Plausible) or front the site with a CDN that provides logs."
          } > report.md

          # Ensure label exists (best-effort)
          gh label create traffic-report --repo "$REPO" --color "0E8A16" \
            --description "Automated GitHub Pages traffic reports" 2>/dev/null || true

          gh issue create --repo "$REPO" \
            --title "Pages Traffic Report — $TODAY" \
            --body-file report.md \
            --label traffic-report
