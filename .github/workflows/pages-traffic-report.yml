name: Daily GitHub Pages Traffic Report

on:
  schedule:
    - cron: '0 0 * * *'   # daily 00:00 UTC (09:00 JST)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Build report and open issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG: OctWebJP
        run: |
          set -euo pipefail
          today=$(date -u +%Y-%m-%d)

          # Discover Pages-enabled repos in the org.
          repos=$(gh api "/orgs/${ORG}/repos" --paginate -q '.[] | select(.has_pages==true) | .name')

          {
            echo "# GitHub Pages Traffic Report — ${today}"
            echo ""
            echo "Source: GitHub Traffic API (14-day rolling window). GitHub Pages does not expose raw web-server access logs; this is the closest available signal."
            echo ""
          } > report.md

          for repo in $repos; do
            echo "Processing ${ORG}/${repo}"
            views_json=$(gh api "/repos/${ORG}/${repo}/traffic/views" 2>/dev/null || echo '{}')
            clones_json=$(gh api "/repos/${ORG}/${repo}/traffic/clones" 2>/dev/null || echo '{}')
            paths_json=$(gh api "/repos/${ORG}/${repo}/traffic/popular/paths" 2>/dev/null || echo '[]')
            refs_json=$(gh api "/repos/${ORG}/${repo}/traffic/popular/referrers" 2>/dev/null || echo '[]')

            v_total=$(echo "$views_json" | jq -r '.count // 0')
            v_unique=$(echo "$views_json" | jq -r '.uniques // 0')
            v_yesterday=$(echo "$views_json" | jq -r --arg d "$(date -u -d 'yesterday' +%Y-%m-%d)" \
              '.views // [] | map(select(.timestamp|startswith($d))) | (.[0].count // 0)')
            vu_yesterday=$(echo "$views_json" | jq -r --arg d "$(date -u -d 'yesterday' +%Y-%m-%d)" \
              '.views // [] | map(select(.timestamp|startswith($d))) | (.[0].uniques // 0)')

            {
              echo "## ${repo}"
              echo ""
              echo "- Pages URL: https://${ORG,,}.github.io/${repo}/"
              echo "- Views (14d): **${v_total}** total / **${v_unique}** unique"
              echo "- Views (yesterday UTC): **${v_yesterday}** total / **${vu_yesterday}** unique"
              echo ""
              echo "### Top paths (14d)"
              echo "| Path | Views | Uniques |"
              echo "|---|---:|---:|"
              echo "$paths_json" | jq -r '.[]? | "| `\(.path)` | \(.count) | \(.uniques) |"' | head -10
              [ -z "$(echo "$paths_json" | jq -r '.[]?')" ] && echo "| _no data_ | 0 | 0 |"
              echo ""
              echo "### Top referrers (14d)"
              echo "| Referrer | Views | Uniques |"
              echo "|---|---:|---:|"
              echo "$refs_json" | jq -r '.[]? | "| \(.referrer) | \(.count) | \(.uniques) |"' | head -10
              [ -z "$(echo "$refs_json" | jq -r '.[]?')" ] && echo "| _no data_ | 0 | 0 |"
              echo ""
              c_total=$(echo "$clones_json" | jq -r '.count // 0')
              c_unique=$(echo "$clones_json" | jq -r '.uniques // 0')
              echo "- Repo clones (14d, for reference): ${c_total} / ${c_unique} unique"
              echo ""
            } >> report.md
          done

          {
            echo "### Analysis"
            echo ""
            top_repo=$(for repo in $repos; do
              v=$(gh api "/repos/${ORG}/${repo}/traffic/views" -q '.count // 0' 2>/dev/null || echo 0)
              echo "$v $repo"
            done | sort -rn | head -1)
            echo "- Highest-traffic site (14d views): **$(echo "$top_repo" | awk '{print $2}')** with $(echo "$top_repo" | awk '{print $1}') views."
            echo "- Report generated automatically by \`.github/workflows/pages-traffic-report.yml\`."
          } >> report.md

          gh issue create \
            --repo "${ORG}/OctWeb" \
            --title "Pages traffic report — ${today}" \
            --label "pages-traffic" \
            --body-file report.md
