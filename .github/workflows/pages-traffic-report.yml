name: Daily GitHub Pages Traffic Report

on:
  schedule:
    - cron: '5 0 * * *'   # 00:05 UTC daily (~09:05 JST)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Generate traffic report and open issue
        env:
          GH_TOKEN: ${{ secrets.PAGES_TRAFFIC_TOKEN || secrets.GITHUB_TOKEN }}
          ORG: OctWebJP
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          BODY=$(mktemp)

          echo "# 📊 GitHub Pages Traffic Report — ${DATE}" > "$BODY"
          echo "" >> "$BODY"
          echo "Automated daily report of traffic on Pages-enabled repos in **${ORG}**." >> "$BODY"
          echo "Source: GitHub Repository Traffic API (Pages does not expose raw HTTP access logs)." >> "$BODY"
          echo "" >> "$BODY"

          REPOS=$(gh api "orgs/${ORG}/repos?per_page=100" --paginate \
                    --jq '.[] | select(.has_pages==true) | .name')

          for repo in $REPOS; do
            echo "## \`${repo}\`" >> "$BODY"
            echo "" >> "$BODY"

            VIEWS=$(gh api "repos/${ORG}/${repo}/traffic/views" 2>/dev/null || echo '{}')
            CLONES=$(gh api "repos/${ORG}/${repo}/traffic/clones" 2>/dev/null || echo '{}')
            PATHS=$(gh api "repos/${ORG}/${repo}/traffic/popular/paths" 2>/dev/null || echo '[]')
            REFS=$(gh api "repos/${ORG}/${repo}/traffic/popular/referrers" 2>/dev/null || echo '[]')

            V_TOTAL=$(echo "$VIEWS"  | jq -r '.count   // 0')
            V_UNIQ=$(echo  "$VIEWS"  | jq -r '.uniques // 0')
            C_TOTAL=$(echo "$CLONES" | jq -r '.count   // 0')
            C_UNIQ=$(echo  "$CLONES" | jq -r '.uniques // 0')

            {
              echo "**14-day totals**"
              echo ""
              echo "| Metric | Total | Unique |"
              echo "|---|---:|---:|"
              echo "| Views  | ${V_TOTAL} | ${V_UNIQ} |"
              echo "| Clones | ${C_TOTAL} | ${C_UNIQ} |"
              echo ""
              echo "**Top paths**"
              echo ""
              echo "| Path | Views | Uniques |"
              echo "|---|---:|---:|"
              echo "$PATHS" | jq -r '.[:10][]? | "| `\(.path)` | \(.count) | \(.uniques) |"'
              echo ""
              echo "**Top referrers**"
              echo ""
              echo "| Referrer | Views | Uniques |"
              echo "|---|---:|---:|"
              echo "$REFS" | jq -r '.[:10][]? | "| \(.referrer) | \(.count) | \(.uniques) |"'
              echo ""
              echo "**Daily views (last 14 days)**"
              echo ""
              echo "| Day | Views | Uniques |"
              echo "|---|---:|---:|"
              echo "$VIEWS" | jq -r '.views[]? | "| \(.timestamp[0:10]) | \(.count) | \(.uniques) |"'
              echo ""
            } >> "$BODY"
          done

          echo "---" >> "$BODY"
          echo "_Note: GitHub Pages does not expose per-request access logs. For richer analytics, add a client-side analytics tag (e.g., GoAccess-compatible pixel, Plausible, Cloudflare Web Analytics) to the Pages sites._" >> "$BODY"

          gh issue create \
            --repo "${ORG}/OctWeb" \
            --title "📊 Pages Traffic Report — ${DATE}" \
            --label "pages-traffic,automated" \
            --body-file "$BODY"
