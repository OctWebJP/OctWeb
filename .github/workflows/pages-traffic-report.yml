name: Pages Traffic Report

on:
  schedule:
    - cron: '10 0 * * *'   # daily 00:10 UTC (09:10 JST)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build org-wide Pages traffic report and open issue
        env:
          # PAT with `repo` scope (classic) or fine-grained token with
          # Administration: Read on every Pages-enabled repo in the org,
          # plus Issues: Write on the issue repo. Required for /traffic/*.
          GH_TOKEN: ${{ secrets.PAGES_TRAFFIC_TOKEN }}
          ORG: OctWebJP
          ISSUE_REPO: OctWeb
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::PAGES_TRAFFIC_TOKEN secret is not set. The default GITHUB_TOKEN cannot read /traffic/*."
            exit 1
          fi
          python3 scripts/pages_traffic_report.py
