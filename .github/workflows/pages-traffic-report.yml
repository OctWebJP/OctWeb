name: Pages Traffic Report

on:
  schedule:
    - cron: '10 0 * * *'   # daily 00:10 UTC (09:10 JST)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Build org-wide Pages traffic report and open issue
        env:
          # PAT (classic: scope `repo`) or fine-grained token with
          # "Administration: Read" on every Pages repo in the org.
          # Required — the default GITHUB_TOKEN cannot read /traffic.
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ORG: OctWebJP
        run: |
          set -euo pipefail
          TODAY=$(date -u +%Y-%m-%d)
          YDAY=$(date -u -d "yesterday" +%Y-%m-%dT00:00:00Z)
          T="${TRAFFIC_TOKEN:-$FALLBACK_TOKEN}"
          AUTH="Authorization: token $T"
          ACC="Accept: application/vnd.github+json"

          # Discover every Pages-enabled repo in the org (paginated).
          REPOS_JSON=$(mktemp); : > "$REPOS_JSON"
          page=1
          while :; do
            chunk=$(curl -sS -H "$AUTH" -H "$ACC" \
              "https://api.github.com/orgs/$ORG/repos?per_page=100&page=$page")
            n=$(jq 'length' <<<"$chunk")
            [ "$n" = "0" ] && break
            jq -c '.[] | select(.has_pages==true and .archived==false) | {name, private}' <<<"$chunk" >> "$REPOS_JSON"
            [ "$n" -lt 100 ] && break
            page=$((page+1))
          done

          NAMES=$(jq -r '.name' "$REPOS_JSON" | sort -u)
          if [ -z "$NAMES" ]; then
            echo "No Pages repos found in $ORG"; exit 0
          fi

          # Probe traffic API on the first repo to detect missing PAT.
          FIRST=$(head -n1 <<<"$NAMES")
          probe=$(curl -sS -o /dev/null -w '%{http_code}' -H "$AUTH" -H "$ACC" \
            "https://api.github.com/repos/$ORG/$FIRST/traffic/views")

          if [ "$probe" != "200" ]; then
            {
              echo "# ⚠️ Pages Traffic Report — $TODAY (setup required)"
              echo
              echo "The daily traffic workflow ran, but the Traffic API returned HTTP \`$probe\` for \`$ORG/$FIRST\`."
              echo
              echo "## Fix (one-time)"
              echo "1. Create a PAT: https://github.com/settings/tokens (classic, scope \`repo\`, **or** fine-grained with \`Administration: Read\` on every Pages repo in \`$ORG\`)."
              echo "2. In this repo → **Settings → Secrets and variables → Actions → New repository secret**."
              echo "3. Name it \`TRAFFIC_TOKEN\` and paste the PAT."
              echo "4. Re-run: **Actions → Pages Traffic Report → Run workflow**."
              echo
              echo "> GitHub Pages does not expose raw HTTP access logs; this report is derived from the Repository Traffic API (rolling 14-day window)."
            } > report.md
            TITLE="⚠️ Pages Traffic Report — $TODAY (setup required)"
          else
            SUMMARY=$(mktemp); DETAILS=$(mktemp)
            echo "| Repo | Pages URL | Views (yday) | Uniques (yday) | Views (14d) | Uniques (14d) |" >  "$SUMMARY"
            echo "|---|---|---:|---:|---:|---:|"                                                     >> "$SUMMARY"

            TOTAL_Y=0; TOTAL_14=0

            while read -r NAME; do
              [ -z "$NAME" ] && continue
              SITE_HOST=$(echo "$ORG" | tr '[:upper:]' '[:lower:]')
              SITE_URL="https://${SITE_HOST}.github.io/${NAME}/"

              V=$(curl -sS -H "$AUTH" -H "$ACC" "https://api.github.com/repos/$ORG/$NAME/traffic/views")
              P=$(curl -sS -H "$AUTH" -H "$ACC" "https://api.github.com/repos/$ORG/$NAME/traffic/popular/paths")
              R=$(curl -sS -H "$AUTH" -H "$ACC" "https://api.github.com/repos/$ORG/$NAME/traffic/popular/referrers")

              TC=$(jq -r '.count   // 0' <<<"$V")
              TU=$(jq -r '.uniques // 0' <<<"$V")
              YC=$(jq -r --arg d "$YDAY" '[.views[]?|select(.timestamp==$d)][0].count   // 0' <<<"$V")
              YU=$(jq -r --arg d "$YDAY" '[.views[]?|select(.timestamp==$d)][0].uniques // 0' <<<"$V")
              TOTAL_Y=$((TOTAL_Y + YC))
              TOTAL_14=$((TOTAL_14 + TC))

              echo "| [\`$NAME\`](https://github.com/$ORG/$NAME) | [$SITE_URL]($SITE_URL) | $YC | $YU | $TC | $TU |" >> "$SUMMARY"

              {
                echo
                echo "### \`$ORG/$NAME\`"
                echo "- Site: $SITE_URL"
                echo "- Yesterday: **$YC views / $YU unique visitors**"
                echo "- 14-day totals: **$TC views / $TU unique visitors**"
                echo
                echo "**Top paths (14d)**"
                if [ "$(jq 'length' <<<"$P")" = "0" ]; then
                  echo "_None._"
                else
                  echo "| Path | Views | Uniques |"
                  echo "|---|---:|---:|"
                  jq -r '.[] | "| `\(.path)` | \(.count) | \(.uniques) |"' <<<"$P"
                fi
                echo
                echo "**Top referrers (14d)**"
                if [ "$(jq 'length' <<<"$R")" = "0" ]; then
                  echo "_None._"
                else
                  echo "| Referrer | Views | Uniques |"
                  echo "|---|---:|---:|"
                  jq -r '.[] | "| **\(.referrer)** | \(.count) | \(.uniques) |"' <<<"$R"
                fi
              } >> "$DETAILS"
            done <<<"$NAMES"

            {
              echo "# 📊 OctWebJP Pages Traffic Report — $TODAY"
              echo
              echo "Daily rollup for every Pages-enabled repo in [\`$ORG\`](https://github.com/$ORG)."
              echo
              echo "## Org-wide summary"
              echo "- **Yesterday total views:** $TOTAL_Y"
              echo "- **14-day total views:** $TOTAL_14"
              echo
              cat "$SUMMARY"
              echo
              echo "## Per-repo detail"
              cat "$DETAILS"
              echo
              echo "---"
              echo "> ℹ️ GitHub Pages does not expose raw HTTP access logs. This report uses the Repository Traffic API (rolling 14-day window, hourly refresh). For per-request logging, add a client-side analytics tag (Plausible, Umami, GA4) or front the site with a CDN."
            } > report.md
            TITLE="Pages Traffic Report — $TODAY"
          fi

          # Ensure label exists (best-effort)
          curl -sS -o /dev/null -X POST -H "$AUTH" -H "$ACC" \
            "https://api.github.com/repos/$REPO/labels" \
            -d '{"name":"traffic-report","color":"0E8A16","description":"Automated GitHub Pages traffic reports"}' || true

          BODY=$(jq -Rs . < report.md)
          curl -sS -X POST -H "$AUTH" -H "$ACC" \
            "https://api.github.com/repos/$REPO/issues" \
            -d "{\"title\": $(jq -Rn --arg t "$TITLE" '$t'), \"body\": $BODY, \"labels\":[\"traffic-report\"]}" \
            | jq '{number, html_url}'
