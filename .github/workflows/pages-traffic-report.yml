name: Pages Traffic Report (org-wide)

on:
  schedule:
    - cron: '10 0 * * *'   # daily 00:10 UTC (09:10 JST)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: .github/scripts
        run: npm install --no-audit --no-fund

      - name: Generate consolidated report
        id: report
        env:
          # PAT (classic, scope: repo) or fine-grained token with
          # Administration: Read on every OctWebJP repo that has Pages enabled.
          # The default GITHUB_TOKEN cannot read the Traffic API cross-repo.
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN || secrets.GITHUB_TOKEN }}
          ORG: OctWebJP
        working-directory: .github/scripts
        run: |
          set -euo pipefail
          node pages-traffic-report.mjs > "$RUNNER_TEMP/report.md"
          echo "path=$RUNNER_TEMP/report.md" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Ensure label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create traffic-report \
            --repo "${{ github.repository }}" \
            --color 0E8A16 \
            --description "Automated GitHub Pages traffic reports" \
            2>/dev/null || true

      - name: Create daily issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Pages Traffic Report (org-wide) — ${{ steps.report.outputs.date }}" \
            --label traffic-report \
            --body-file "${{ steps.report.outputs.path }}"

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-traffic-report-${{ steps.report.outputs.date }}
          path: ${{ steps.report.outputs.path }}
