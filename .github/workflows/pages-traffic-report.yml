name: Pages Traffic Report

on:
  schedule:
    - cron: '10 0 * * *'   # daily 00:10 UTC (09:10 JST)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      ORG: OctWebJP
      # PAT (classic: repo scope, or fine-grained with Administration:Read + Metadata:Read
      # on every Pages repo in the org) — required for /traffic/* endpoints.
      TRAFFIC_TOKEN: ${{ secrets.PAGES_TRAFFIC_TOKEN }}
      FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Build org-wide report and open issue
        run: |
          set -euo pipefail
          T="${TRAFFIC_TOKEN:-$FALLBACK_TOKEN}"
          AUTH=(-H "Authorization: Bearer $T" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          TODAY=$(date -u +%Y-%m-%d)
          YDAY=$(date -u -d "yesterday" +%Y-%m-%dT00:00:00Z)

          # 1. Discover Pages-enabled repos in the org (paginated).
          REPOS=()
          page=1
          while : ; do
            chunk=$(curl -sS "${AUTH[@]}" "https://api.github.com/orgs/$ORG/repos?per_page=100&page=$page&type=all")
            n=$(jq 'length' <<<"$chunk")
            [ "$n" = "0" ] && break
            while IFS= read -r name; do REPOS+=("$name"); done < <(jq -r '.[] | select(.has_pages==true and .archived==false) | .name' <<<"$chunk")
            [ "$n" -lt 100 ] && break
            page=$((page+1))
          done
          echo "Pages repos: ${REPOS[*]:-<none>}"

          probe_code=$(curl -sS -o /dev/null -w '%{http_code}' "${AUTH[@]}" \
            "https://api.github.com/repos/$ORG/${REPOS[0]:-unknown}/traffic/views" || echo 000)

          {
            echo "# 📊 GitHub Pages Access Report — $TODAY"
            echo
            echo "**Organization:** [\`$ORG\`](https://github.com/$ORG)"
            echo
            echo "> GitHub Pages does not expose raw HTTP access logs. This report is derived from the Repository Traffic API (rolling 14-day window: views, unique visitors, top paths, top referrers) plus \`/pages\` deployment status."
            echo
          } > report.md

          if [ "$probe_code" != "200" ]; then
            {
              echo "## ⚠️ Setup required (HTTP $probe_code)"
              echo
              echo "The default \`GITHUB_TOKEN\` cannot read \`/repos/{owner}/{repo}/traffic/*\`. Create a PAT (classic \`repo\` scope, or fine-grained with **Administration: Read** + **Metadata: Read** on every Pages repo in \`$ORG\`) and store it as the repo secret \`PAGES_TRAFFIC_TOKEN\`, then re-run this workflow."
            } >> report.md
            TITLE="⚠️ Pages access report — $TODAY (setup required)"
          else
            echo "## Sites covered" >> report.md
            echo >> report.md
            echo "| Repo | Pages URL | Status | HTTPS |" >> report.md
            echo "|---|---|---|---|" >> report.md
            declare -A VIEWS_C VIEWS_U CLONES_C CLONES_U YEST_C YEST_U TOPPATH TOPREF
            for r in "${REPOS[@]}"; do
              pg=$(curl -sS "${AUTH[@]}" "https://api.github.com/repos/$ORG/$r/pages" || echo '{}')
              url=$(jq -r '.html_url // "-"' <<<"$pg")
              st=$(jq -r '.status // "-"' <<<"$pg")
              https=$(jq -r 'if .https_enforced then "✅" else "❌" end' <<<"$pg")
              echo "| \`$r\` | $url | $st | $https |" >> report.md

              v=$(curl -sS "${AUTH[@]}" "https://api.github.com/repos/$ORG/$r/traffic/views")
              c=$(curl -sS "${AUTH[@]}" "https://api.github.com/repos/$ORG/$r/traffic/clones")
              p=$(curl -sS "${AUTH[@]}" "https://api.github.com/repos/$ORG/$r/traffic/popular/paths")
              rf=$(curl -sS "${AUTH[@]}" "https://api.github.com/repos/$ORG/$r/traffic/popular/referrers")
              VIEWS_C[$r]=$(jq -r '.count // 0' <<<"$v")
              VIEWS_U[$r]=$(jq -r '.uniques // 0' <<<"$v")
              CLONES_C[$r]=$(jq -r '.count // 0' <<<"$c")
              CLONES_U[$r]=$(jq -r '.uniques // 0' <<<"$c")
              YEST_C[$r]=$(jq -r --arg d "$YDAY" '[.views[]?|select(.timestamp==$d)][0].count // 0' <<<"$v")
              YEST_U[$r]=$(jq -r --arg d "$YDAY" '[.views[]?|select(.timestamp==$d)][0].uniques // 0' <<<"$v")
              TOPPATH[$r]=$(jq -r 'if length==0 then "—" else "`\(.[0].path)` (\(.[0].count))" end' <<<"$p")
              TOPREF[$r]=$(jq -r 'if length==0 then "—" else "\(.[0].referrer) (\(.[0].count))" end' <<<"$rf")
            done

            {
              echo
              echo "## Yesterday ($YDAY)"
              echo
              echo "| Repo | Views | Unique visitors |"
              echo "|---|---:|---:|"
              for r in "${REPOS[@]}"; do echo "| \`$r\` | ${YEST_C[$r]} | ${YEST_U[$r]} |"; done
              echo
              echo "## Rolling 14-day totals"
              echo
              echo "| Repo | Views | Unique | Clones | Unique cloners | Top path | Top referrer |"
              echo "|---|---:|---:|---:|---:|---|---|"
              for r in "${REPOS[@]}"; do
                echo "| \`$r\` | ${VIEWS_C[$r]} | ${VIEWS_U[$r]} | ${CLONES_C[$r]} | ${CLONES_U[$r]} | ${TOPPATH[$r]} | ${TOPREF[$r]} |"
              done
              echo
              echo "## Analysis"
              tot_v=0; tot_u=0; tot_c=0
              for r in "${REPOS[@]}"; do
                tot_v=$((tot_v + VIEWS_C[$r]))
                tot_u=$((tot_u + VIEWS_U[$r]))
                tot_c=$((tot_c + CLONES_C[$r]))
              done
              echo "- Aggregate 14-day views across $ORG Pages repos: **$tot_v** (unique: $tot_u)."
              echo "- Aggregate 14-day clones: **$tot_c**."
              # top repo by views
              top_r=$(for r in "${REPOS[@]}"; do echo "${VIEWS_C[$r]} $r"; done | sort -nr | head -1 | awk '{print $2}')
              echo "- Highest-traffic repo (views): \`$top_r\`."
              echo
              echo "> For real end-user analytics on the deployed Pages sites, add a lightweight tag (Plausible, GoatCounter, Umami, GA4)."
            } >> report.md
            TITLE="Pages access report — $TODAY"
          fi

          # Ensure label exists (best-effort).
          curl -sS -o /dev/null -X POST "${AUTH[@]}" \
            "https://api.github.com/repos/${{ github.repository }}/labels" \
            -d '{"name":"traffic-report","color":"0E8A16","description":"Automated GitHub Pages traffic reports"}' || true

          BODY=$(jq -Rs . < report.md)
          curl -sS -X POST "${AUTH[@]}" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d "$(jq -n --arg t "$TITLE" --argjson b "$BODY" '{title:$t, body:$b, labels:["traffic-report"]}')" \
            | jq '{number, html_url}'
