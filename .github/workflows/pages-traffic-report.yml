name: Daily Pages traffic report

on:
  schedule:
    # 09:00 JST = 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      # PAT with `repo` scope on the org is required to read traffic for
      # sibling repos (hanasaki, shionoya). Falls back to GITHUB_TOKEN, which
      # only sees traffic for this repo.
      GH_TOKEN: ${{ secrets.TRAFFIC_READ_TOKEN || secrets.GITHUB_TOKEN }}
      ORG: OctWebJP
      REPOS: "hanasaki shionoya OctWeb"
    steps:
      - name: Build report
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          echo "DATE=$DATE" >> "$GITHUB_ENV"
          {
            echo "## GitHub Pages traffic report — $DATE"
            echo ""
            echo "> **Note:** GitHub Pages does not expose raw HTTP access logs. This report uses the [Repository Traffic API](https://docs.github.com/en/rest/metrics/traffic) — rolling 14-day views, unique visitors, top paths, and top referrers per repository."
            echo ""
            echo "### Summary (last 14 days)"
            echo ""
            echo "| Repo | Site | Views | Uniques |"
            echo "|------|------|------:|--------:|"
            for r in $REPOS; do
              V=$(gh api "repos/$ORG/$r/traffic/views")
              C=$(echo "$V" | jq .count)
              U=$(echo "$V" | jq .uniques)
              echo "| \`$r\` | https://octwebjp.github.io/$r/ | $C | $U |"
            done
            echo ""
            for r in $REPOS; do
              echo "### \`$r\`"
              echo ""
              echo "**Daily views (14d):**"
              echo ""
              echo "| Date | Views | Uniques |"
              echo "|------|------:|--------:|"
              gh api "repos/$ORG/$r/traffic/views" | jq -r '.views[] | "| \(.timestamp[0:10]) | \(.count) | \(.uniques) |"'
              echo ""
              echo "**Top paths:**"
              echo ""
              PATHS=$(gh api "repos/$ORG/$r/traffic/popular/paths")
              if [ "$(echo "$PATHS" | jq 'length')" = "0" ]; then
                echo "_No path data._"
              else
                echo "| Path | Views | Uniques |"
                echo "|------|------:|--------:|"
                echo "$PATHS" | jq -r '.[] | "| `\(.path)` | \(.count) | \(.uniques) |"'
              fi
              echo ""
              echo "**Top referrers:**"
              echo ""
              REFS=$(gh api "repos/$ORG/$r/traffic/popular/referrers")
              if [ "$(echo "$REFS" | jq 'length')" = "0" ]; then
                echo "_No referrer data._"
              else
                echo "| Referrer | Views | Uniques |"
                echo "|----------|------:|--------:|"
                echo "$REFS" | jq -r '.[] | "| \(.referrer) | \(.count) | \(.uniques) |"'
              fi
              echo ""
            done
            echo "---"
            echo "_Automated report generated by \`.github/workflows/pages-traffic-report.yml\`._"
          } > report.md

      - name: Ensure label exists
        run: gh label create pages-traffic --repo "$ORG/OctWeb" --color 0E8A16 --description "Daily Pages traffic report" 2>/dev/null || true

      - name: Create issue
        run: gh issue create --repo "$ORG/OctWeb" --title "Pages traffic report — $DATE" --body-file report.md --label pages-traffic
