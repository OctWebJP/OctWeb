name: Daily Pages Access Report

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Generate and file report
        env:
          GH_TOKEN: ${{ secrets.PAGES_TRAFFIC_TOKEN }}
          ORG: OctWebJP
          TARGET_REPO: OctWebJP/OctWeb
        run: |
          set -euo pipefail
          command -v jq >/dev/null || sudo apt-get update -qq && sudo apt-get install -y -qq jq
          TODAY=$(date -u +%F)
          REPORT=$(mktemp)
          {
            echo "# GitHub Pages Access Report — $TODAY"
            echo
            echo "Source: GitHub Repository Traffic API (14-day window). GitHub Pages does not expose raw access logs; repo traffic (views, clones, popular paths, referrers) is used as the closest analytics proxy."
            echo
            echo "## Summary"
            echo
            echo "| Repo | Pages URL | Views (14d) | Unique | Clones | Unique cloners |"
            echo "|------|-----------|-------------|--------|--------|----------------|"
          } > "$REPORT"

          # Discover all repos in the org that have Pages enabled
          REPOS=$(gh api --paginate "/orgs/${ORG}/repos" --jq '.[] | select(.has_pages==true) | .name')

          DETAILS=$(mktemp)
          for r in $REPOS; do
            V=$(gh api "/repos/${ORG}/${r}/traffic/views")
            C=$(gh api "/repos/${ORG}/${r}/traffic/clones")
            P=$(gh api "/repos/${ORG}/${r}/traffic/popular/paths")
            R=$(gh api "/repos/${ORG}/${r}/traffic/popular/referrers")
            VC=$(jq -r '.count' <<<"$V"); VU=$(jq -r '.uniques' <<<"$V")
            CC=$(jq -r '.count' <<<"$C"); CU=$(jq -r '.uniques' <<<"$C")
            URL="https://octwebjp.github.io/${r}/"
            echo "| [${r}](https://github.com/${ORG}/${r}) | ${URL} | ${VC} | ${VU} | ${CC} | ${CU} |" >> "$REPORT"
            {
              echo
              echo "### ${r}"
              echo
              echo "- Pages URL: ${URL}"
              echo "- Views: **${VC}** total, **${VU}** unique (14 days)"
              echo "- Clones: **${CC}** total, **${CU}** unique (14 days)"
              PL=$(jq -r 'if length==0 then "" else (.[:10] | map("  - `\(.path)` — \(.count) views, \(.uniques) unique") | join("\n")) end' <<<"$P")
              if [ -n "$PL" ]; then echo "- Top paths:"; echo "$PL"; else echo "- Top paths: _(none in last 14 days)_"; fi
              RL=$(jq -r 'if length==0 then "" else (.[:10] | map("  - `\(.referrer)` — \(.count) views, \(.uniques) unique") | join("\n")) end' <<<"$R")
              if [ -n "$RL" ]; then echo "- Top referrers:"; echo "$RL"; else echo "- Top referrers: _(none in last 14 days)_"; fi
              DAILY=$(jq -r '.views | map("\(.timestamp[0:10]):\(.count)/\(.uniques)") | join(", ")' <<<"$V")
              echo "- Daily views (14d, count/unique): ${DAILY}"
            } >> "$DETAILS"
          done

          cat "$DETAILS" >> "$REPORT"
          {
            echo
            echo "---"
            echo "_Auto-generated by \`.github/workflows/pages-access-report.yml\`._"
          } >> "$REPORT"

          gh issue create --repo "${TARGET_REPO}" \
            --title "GitHub Pages Access Report — ${TODAY}" \
            --body-file "$REPORT"
